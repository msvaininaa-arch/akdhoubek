<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="author" content="د. يحيى عينينا">
<title>شجرة أهل اكذوبك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Markazi+Text:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow reading column, sticky search on top; a person is a "nasab sheet" — name, lineage chain, then kin lists. */
:root{
  --bg:#f4f5f2; --paper:#ffffff; --ink:#111a22; --muted:#3f4a54; --line:#dfe2dc;
  --accent:#1f3b57; --accent-soft:#e6edf3; --living:#0f7b6c; --orange:#c2661a;
  --f1:#6a4c93; --f2:#b4540a; --f3:#1f5e99; --f4:#8e1f4f; --f0:#4b6a3a;
  --display:"Amiri","Markazi Text",serif; --body:"Markazi Text","Amiri","Noto Naskh Arabic",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171c; --paper:#1a2128; --ink:#f3f6f8; --muted:#bcc6ce; --line:#2c353e;
  --accent:#8fb4d8; --accent-soft:#1f2c39; --living:#4cc2b0; --orange:#e48b45;
  --f1:#b39ad8; --f2:#e89257; --f3:#79acdf; --f4:#d96c99; --f0:#98bf83; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --paper:#1a2128; --ink:#f3f6f8; --muted:#bcc6ce; --line:#2c353e;
  --accent:#8fb4d8; --accent-soft:#1f2c39; --living:#4cc2b0; --orange:#e48b45;
  --f1:#b39ad8; --f2:#e89257; --f3:#79acdf; --f4:#d96c99; --f0:#98bf83; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:21px;font-weight:500;line-height:1.7;direction:rtl}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;position:relative}
.brand{font-family:var(--display);font-weight:700;color:var(--accent);font-size:20px;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.search{flex:1;min-width:0}
#q{width:100%;font:inherit;font-size:18px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
#q:focus{outline:2px solid var(--accent);outline-offset:1px}
.results{position:absolute;inset-inline:16px;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:12px;max-height:60vh;overflow:auto;box-shadow:0 10px 30px rgb(0 0 0 / .12)}
.res{display:flex;gap:10px;align-items:baseline;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-align:right;width:100%;background:none;border-inline:0;border-top:0;font:inherit;color:inherit}
.res:hover,.res:focus{background:var(--accent-soft);outline:none}
.res .nm{font-family:var(--display);font-weight:700;white-space:nowrap}.res .ch{color:var(--muted);font-size:16px;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;align-self:center}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.hero{padding-block:28px 10px}
.hero h1{font-size:34px;color:var(--accent);line-height:1.3}
.hero p{color:var(--muted);margin:.4em 0 0;max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;color:var(--muted);font-size:17px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.fams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px;margin-top:22px}
.fam{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:5px solid var(--fc)}
.fam h2{font-size:21px;color:var(--fc)}
.fam .sub{color:var(--muted);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:inherit;font-size:17px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.sec{margin-top:26px}
.sec>h3{font-size:19px;color:var(--muted);font-weight:500;letter-spacing:.02em;margin-bottom:8px}
/* person sheet */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-top:20px;overflow:hidden}
.sh-head{padding:18px 18px 14px;border-top:6px solid var(--fc)}
.famtag{font-size:16px;color:var(--fc);font-weight:700}
.pname{font-size:36px;font-weight:700;line-height:1.35;margin-top:2px}
.pname .al{font-size:22px;color:var(--muted);font-family:var(--body);font-weight:400}
.chain{margin-top:6px;color:var(--muted);font-size:18.5px;line-height:1.9}
.chain a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted)}
.chain a:hover{color:var(--accent);border-color:var(--accent)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bdg{font-size:15.5px;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.bdg.na{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.bdg.lv{background:color-mix(in srgb,var(--living) 16%,transparent);color:var(--living)}
.bdg.cut,.bdg.cut2{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--ink)}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;padding:12px 18px 16px;border-top:1px solid var(--line);margin:0}
.facts dt{color:var(--muted);font-size:17px;font-weight:600}.facts dd{margin:0;min-width:0}
.facts .wide{grid-column:1 / -1;color:var(--accent)}
.kin{padding:4px 18px 18px;display:grid;gap:16px;border-top:1px solid var(--line)}
.kin h3{font-size:18px;color:var(--muted);font-weight:500;margin:12px 0 6px}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{font:inherit;font-family:var(--display);font-size:20px;text-align:right;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer;max-width:100%}
.pbtn:hover,.pbtn:focus-visible{border-color:var(--accent);outline:none}
.pbtn small{color:var(--muted);font-size:15px}
.pbtn.f{background:color-mix(in srgb,var(--f4) 6%,var(--bg))}
.pbtn.na{box-shadow:inset -3px 0 0 var(--orange)}
.pbtn.lv{box-shadow:inset -3px 0 0 var(--living)}
.empty{color:var(--muted);font-size:17px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tbtn{font:inherit;font-size:17px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:5px 14px;cursor:pointer}
.tbtn:hover{border-color:var(--accent)}
.note{color:var(--muted);font-size:16px;margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:480px){.pname{font-size:27px}.hero h1{font-size:28px}.brand{font-size:17px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
.apx{display:grid;gap:8px}
.apxb{font:inherit;text-align:right;display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer}
.apxb:hover,.apxb:focus-visible{border-color:var(--accent);outline:none}
.apxb b{display:block;font-family:var(--display)}.apxb small{color:var(--muted);font-size:16px}
.apn{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.apxpage{padding-block:24px 0}.apxpage h1{font-size:30px;color:var(--accent)}
.eyebrow{color:var(--muted);font-size:16px;letter-spacing:.03em}
.lead{color:var(--muted);margin:.4em 0 16px;max-width:62ch}
.agrp{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:12px;border-top:4px solid var(--fc,var(--accent))}
.agrp h3{font-size:21px;margin-bottom:8px}.agrp h3 small{color:var(--muted);font-weight:400}
.rows{display:grid;gap:8px}.row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0;padding-bottom:0}
.arr{color:var(--muted)}.cnt{color:var(--muted);font-size:15px}.txt{min-width:0}
.src{color:var(--muted);font-size:15px;margin-top:8px}.kline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.abox{background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin-top:16px}
.tlist,.tlist ul{list-style:none;margin:0;padding-inline-start:18px;border-inline-start:2px solid var(--line)}
.tlist{padding-inline-start:0;border:0}.tlist li{margin:6px 0}
.tnode{display:inline-block;padding:2px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);border-inline-start:4px solid var(--fc,var(--line))}
.tnode small{color:var(--muted);font-size:15px}
.hero .by{font-family:var(--display);font-weight:700;color:var(--ink);font-size:20px;margin-top:2px}
</style>

</head>
<body>
<header class="top"><div class="bar">
  <button class="brand" id="home" type="button">أهل اكذوبك</button>
  <div class="search"><input id="q" type="search" placeholder="ابحث باسم أو نسب… مثل: باباه، ميمونة بنت أحمذ الله" autocomplete="off" aria-label="بحث"><div class="results" id="res" hidden></div></div>
</div></header>
<main class="wrap" id="view"></main>

    <div class="tools"><button class="tbtn" type="button" id="copy">نسخ رابط هذه البطاقة</button>${p.fa?`<button class="tbtn" type="button" data-go="${p.fa}">↑ إلى الأب</button>`:''}<button class="tbtn" type="button" data-home="1">الصفحة الأولى</button></div>`;
  document.title=p.n+' — شجرة أهل اكذوبك';window.scrollTo(0,0);
  document.getElementById('copy').onclick=async e=>{const u=location.href;try{await navigator.clipboard.writeText(u);e.target.textContent='نُسخ الرابط'}catch(_){e.target.textContent=u}};
}

const DY=id=>{const r=(D[id]?.r||[]).find(x=>x[0]==='الوفاة');return r?r[1].split('/')[0]:''};
const APX=[
 ['ملتقى الأسر الأربع في النسب','من ألفغ امهم إلى رؤوس الأسر'],
 ['المصاهرات بين الأسر الأربع','من تزوّج من أسرة أخرى من أهل اكذوبك'],
 ['أخوال أهل اكذوبك من البطون الأخرى','أمهات من غير أهل اكذوبك وأبناؤهن'],
 ['أهل اكذوبك أخوالًا لغيرهم','بنات أهل اكذوبك في البطون الأخرى'],
 ['الإخوة لأم','إخوة جمعتهم أم واحدة'],
 ['مدافن الأعلام','المقابر ومن دُفن فيها'],
 ['الأسر المنقطعة','بيوت كان لها عقب ثم انقرض'],
 ['من انقطع عقبه، ومن لم يعقب','']];
function grp(title,count,inner,color){return `<div class="agrp"${color?` style="--fc:${color}"`:''}><h3>${esc(title)}${count!=null?` <small>(${count})</small>`:''}</h3>${inner}</div>`}
function apxView(n){
  let body='';
  if(n===1){const L=(t,s,c,k)=>`<li><span class="tnode"${c?` style="--fc:${c}"`:''}>${esc(t)}${s?` <small>${esc(s)}</small>`:''}</span>${k?`<ul>${k}</ul>`:''}</li>`;
    body=`<p class="lead">الأسر الأربع كلها من ذرية ألفغ امهم: ثلاث منها من ولده أوبَك، والرابعة من ولده أوبُك شقيق أوبَك، وأمهما زينيب القلقمية.</p>
    <ul class="tlist">${L('ألفغ امهم','الجد الجامع','var(--f0)',L('أوبَك','','',L('أحمد','','',L('بله','أهل ابن أحمد','var(--f1)'))+L('المختار','','',L('يحيى','','',L('أحمد','','',L('المحمود','أهل الأديب','var(--f2)'))))+L('يحي','','',L('محنض','','',L('باب نحمود','','',L('الفاضل','','',L('الشد','أهل عينينا','var(--f3)')))+L('أحمان حمت','أهل اليدالي، مع أهل عينينا','var(--f3)'))))+L('أوبُك','','',L('ألفغ امهم','','',L('محنض','أهل محنض','var(--f4)'))))}</ul>
    <div class="abox">أبناء عينينا (محمد فال، وحبيب الله، والشيخ أحمدو، وأحمد المقري، وعيشة، وعبد الله) يلتقي فيهم ثلاث من الأسر الأربع: أبوهم من أهل عينينا، وأمهم ميمونة بنت أحمذ الله من أهل ابن أحمد، وجدتهم لأمهم ماي بنت الأديب من أهل الأديب.</div>`}
  if(n===2){body='<p class="lead">كل مجموعة: زوجات من أسرة تزوّجن رجالًا من أسرة أخرى، فأبناؤهم أخوالهم من أسرة أمهم.</p>'+Object.entries(A.mar).sort((a,b)=>b[1].length-a[1].length).map(([k,it])=>{const [f,t]=k.split('|');return grp(`من ${f} إلى ${t}`,it.length,`<div class="rows">${it.map(([w,h,c])=>`<div class="row">${pbtn(w)}<span class="arr">←</span>${pbtn(h)}${c?`<small class="cnt">${c} من الولد</small>`:''}</div>`).join('')}</div>`,FC(f))}).join('')}
  if(n===3){body='<p class="lead">أمهات من غير أهل اكذوبك أنجبن فيهم، مجموعات بحسب بطونهن وقبائلهن؛ فهذه البطون أخوال لأبنائهن.</p>'+A.oin.map(([b,it])=>grp(b,it.length,`<div class="rows">${it.map(([m,ks])=>`<div class="row">${pbtn(m)}<span class="arr">أمّ</span><div class="plist">${ks.map(k=>pbtn(k)).join('')}</div></div>`).join('')}</div>`)).join('')}
  if(n===4){body='<p class="lead">بنات أهل اكذوبك اللاتي تزوّجن في بطون أخرى، فصار أهل اكذوبك أخوالًا لأبنائهن.</p>'+A.oout.map(([b,it])=>grp(b,it.length,`<div class="rows">${it.map(([w,s])=>`<div class="row">${pbtn(w)}<span class="txt">${esc(s)}</span></div>`).join('')}</div>`)).join('')}
  if(n===5){body='<p class="lead">إخوة جمعتهم أمّ واحدة وفرّق بينهم الآباء، كما ثبت في المصادر.</p>'+A.halfc.map(([m,rows,src])=>grp('الأم الجامعة: '+m,null,`<div class="rows">${rows.map(([a,b])=>`<div class="row"><span class="txt"><b>${esc(a)}:</b> ${esc(b)}</span></div>`).join('')}</div><div class="src">المصدر: ${esc(src)}</div>`)).join('')+grp('ومن البطاقات',A.half.length,`<div class="rows">${A.half.map(([p,t,m])=>`<div class="row">${pbtn(p)}<span class="txt">إخوته لأمه: ${esc(t)}</span>${m?`<small class="cnt">الجامع:</small>${pbtn(m)}`:''}</div>`).join('')}</div>`)}
  if(n===6){body='<p class="lead">أماكن الدفن المذكورة في المصادر ومن دُفن فيها، مرتّبين على تاريخ الوفاة.</p>'+A.bur.map(([pl,ids])=>grp('⚑ '+pl,ids.length,`<div class="plist">${ids.map(i=>pbtn(i,DY(i))).join('')}</div>`)).join('')}
  if(n===7){body='<p class="lead">بيوت كان لها عقب ثم انقرض نسلها، من الأقدم إلى الأحدث.</p>'+A.ext.map(([id,t,src])=>{const p=D[id];return grp('⊘ '+t,null,`<div class="txt">${esc(p.c)}</div><div class="kline"><span class="arr">من عُرف من عقبه:</span>${p.kids.length?`<div class="plist">${p.kids.map(k=>pbtn(k)).join('')}</div>`:'<span class="txt">لا يُعرف أبناؤه بأسمائهم</span>'}</div><div class="plist">${pbtn(id,'بطاقته')}</div><div class="src">المستند: ${esc(src)}</div>`,FC(p.f))}).join('')}
  if(n===8){body='<p class="lead">انقطع عقبه: من أعقب ثم انقطع نسله. لم يعقب: من لم يكن له ولد أصلًا.</p>'+grp('انقطع عقبه',A.cut.length,`<div class="plist">${A.cut.map(i=>pbtn(i,DY(i))).join('')}</div>`)+grp('لم يعقب',A.na.length,`<div class="plist">${A.na.map(i=>pbtn(i,DY(i))).join('')}</div>`)}
  view.innerHTML=`<section class="apxpage"><div class="eyebrow">ملحق ${n}</div><h1>${APX[n-1][0]}</h1>${body}</section>
  <div class="tools">${n>1?`<button class="tbtn" type="button" data-apx="${n-1}">→ الملحق السابق</button>`:''}${n<APX.length?`<button class="tbtn" type="button" data-apx="${n+1}">الملحق التالي ←</button>`:''}<button class="tbtn" type="button" data-home="1">الصفحة الأولى</button></div>`;
  document.title=APX[n-1][0]+' — شجرة أهل اكذوبك';window.scrollTo(0,0)}
function route(){const h=location.hash.slice(1);const m=h.match(/^a(\d)$/);if(m&&APX[+m[1]-1]){apxView(+m[1]);return}h&&D[h]?personView(h):homeView()}
function go(id){if(location.hash.slice(1)===id)route();else location.hash=id}
document.addEventListener('click',e=>{const ax=e.target.closest('[data-apx]');if(ax){e.preventDefault();location.hash='a'+ax.dataset.apx;return}const g=e.target.closest('[data-go]');if(g){e.preventDefault();res.hidden=true;q.value='';go(g.dataset.go);return}
  if(e.target.closest('[data-home]')||e.target.closest('#home')){e.preventDefault();history.pushState('',document.title,location.pathname+location.search);homeView();return}
  if(!e.target.closest('.search'))res.hidden=true});
q.addEventListener('input',()=>{const t=norm(q.value);if(t.length<2){res.hidden=true;return}
  const words=t.split(' ');const hits=IDX.filter(([id,s])=>words.every(w=>s.includes(w)))
   .sort((a,b)=>(D[a[0]].out-D[b[0]].out)||(norm(D[b[0]].n).startsWith(words[0])-norm(D[a[0]].n).startsWith(words[0]))).slice(0,40);
  res.innerHTML=hits.length?hits.map(([id])=>{const p=D[id];return `<button class="res" data-go="${id}" type="button"><span class="dot" style="background:${FC(p.f)}"></span><span class="nm">${esc(label(id))}</span><span class="ch">${esc(p.c)}</span></button>`}).join(''):'<div class="res" style="cursor:default">لا نتيجة. جرّب جزءًا من الاسم.</div>';res.hidden=false});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=res.querySelector('[data-go]');if(b)b.click()}if(e.key==='Escape')res.hidden=true});
window.addEventListener('hashchange',route);
route();
</script>

</body>
